name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The committed lockfile is generated on Windows by maintainers; npm's
      # optional-dependency resolution (native rollup/esbuild binaries) does
      # not reliably add the Linux variant on top of an existing lockfile
      # recorded from a different platform (npm/cli#4828). Resolve fresh
      # for this runner's platform instead of trusting the committed file.
      - run: rm -f package-lock.json && npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security gate - no eval/exec/sympify/parse_expr calls anywhere in the verifier
        run: |
          set -e
          if grep -RnE '\b(eval|exec|sympify|parse_expr)\s*\(' verifier/ --include='*.py'; then
            echo "Forbidden raw-string evaluation call found in verifier/" >&2
            exit 1
          fi
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r verifier/requirements.txt
          .venv/bin/python -m pytest verifier -q

  e2e:
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: rm -f package-lock.json && npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
